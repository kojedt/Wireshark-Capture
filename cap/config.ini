[CAPTURE]
; Interface number, as reported by "tshark -D" (also: capture_auto.py -D)
interface = 8
; Capture duration per file, in seconds
duration = 600
; Keep only the last N raw files within the current day's folder. 0 = disabled
retain_count = 0
; Days a day-folder stays as raw .pcapng before being compressed to .zip. 0 = disabled
retain_days = 7
; Total lifetime (raw + zip) in days before data is deleted permanently. Must be > retain_days. 0 = disabled
retain_log_days = 30
; Root folder where daily capture subfolders (YYYYMMDD) are created
base_folder = C:\captures
; Full path to tshark.exe
tshark_path = C:\Program Files\Wireshark\tshark.exe

